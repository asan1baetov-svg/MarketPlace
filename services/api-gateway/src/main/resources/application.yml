server:
  # PORT задаёт хостинг (Railway/Heroku), SERVER_PORT — локальный запуск
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          # JWKS auth-service — публичный ключ для проверки подписи access-JWT.
          jwk-set-uri: ${GATEWAY_JWT_JWK_SET_URI:http://localhost:8081/oauth2/jwks}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

gateway:
  cors:
    # домены фронтов через запятую; * — любой (токен ходит в заголовке, не в cookie)
    allowed-origins: ${GATEWAY_CORS_ORIGINS:*}
  response-timeout: 30s
  services:
    auth: ${GATEWAY_AUTH_URL:http://localhost:8081}
    catalog: ${GATEWAY_CATALOG_URL:http://localhost:8082}
    order: ${GATEWAY_ORDER_URL:http://localhost:8083}
    finance: ${GATEWAY_FINANCE_URL:http://localhost:8084}
    courier: ${GATEWAY_COURIER_URL:http://localhost:8085}
    mlm: ${GATEWAY_MLM_URL:http://localhost:8086}
    notification: ${GATEWAY_NOTIFICATION_URL:http://localhost:8087}
