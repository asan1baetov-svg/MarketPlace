server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: finance-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finance}
    username: ${SPRING_DATASOURCE_USERNAME:gem}
    password: ${SPRING_DATASOURCE_PASSWORD:gem}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: finance-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true

finance:
  platform-owner-ref: platform.incoming
  commission-owner-ref: platform.commission
  default-currency: KGS
  mlm-base-url: ${MLM_BASE_URL:http://localhost:8086}
  mock-acquiring:
    # симулятор оплаты /mock-acquiring/pay/** — выключить на любом общедоступном стенде
    simulator-enabled: ${FINANCE_MOCK_SIMULATOR_ENABLED:true}
  acquiring:
    # mock | finik — приём оплат клиентов на счёт платформы
    provider: ${FINANCE_ACQUIRING_PROVIDER:mock}
  payout:
    # mock | finik — переводы магазинам (их часть заказа) сразу после оплаты; комиссия остаётся на счёте
    provider: ${FINANCE_PAYOUT_PROVIDER:mock}
    auto-enabled: ${FINANCE_AUTO_PAYOUT_ENABLED:true}
    poll-interval: 30s
  finik:
    acquiring:
      base-url: ${FINIK_BASE_URL:}
      api-key: ${FINIK_API_KEY:}
      account-id: ${FINIK_ACCOUNT_ID:}
      private-key: ${FINIK_PRIVATE_KEY_CONTENT:}
      # публичный адрес webhook через api-gateway — Finik подписывает именно его хост и путь
      webhook-url: ${FINIK_WEBHOOK_URL:https://api.example.kg/api/webhooks/acquiring/finik}
      redirect-url: ${FINIK_REDIRECT_URL:}
    transfer:
      base-url: ${FINIK_TRANSFER_BASE_URL:https://api.paymentsgateway.averspay.kg}
      api-key: ${FINIK_TRANSFER_API_KEY:}
      account-id: ${FINIK_TRANSFER_ACCOUNT_ID:}
      user-id: ${FINIK_TRANSFER_USER_ID:}
      private-key: ${FINIK_TRANSFER_PRIVATE_KEY_CONTENT:}
  mock-webhook-secret: ${FINANCE_MOCK_WEBHOOK_SECRET:mock-secret}
  outbox-poll-interval: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

gem:
  security:
    # Общий служебный токен для /internal/** (совпадает у всех сервисов и в auth-service)
    internal-token: ${GEM_INTERNAL_TOKEN:local-dev-internal-token-change-me}
    jwt:
      jwk-set-uri: ${GEM_JWT_JWK_SET_URI:http://localhost:8081/oauth2/jwks}
      issuer: ${AUTH_JWT_ISSUER:http://localhost:8081}
      audience: ${AUTH_JWT_AUDIENCE:green-eco-mall}
