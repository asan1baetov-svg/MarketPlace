server:
  port: ${SERVER_PORT:8082}

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  application:
    name: catalog-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/catalog}
    username: ${SPRING_DATASOURCE_USERNAME:gem}
    password: ${SPRING_DATASOURCE_PASSWORD:gem}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: catalog-service
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "greenecomall.common.events.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true

catalog:
  order-base-url: ${ORDER_BASE_URL:http://localhost:8083}
  photo:
    storage-dir: ${CATALOG_MEDIA_DIR:data/media}
    public-base-url: ${CATALOG_MEDIA_PUBLIC_URL:http://localhost:8080/api/catalog/media}
    max-upload-mb: 10
    ai:
      # mock (dev: оригинал без изменений) | gemini
      provider: ${PHOTO_AI_PROVIDER:mock}
      enabled: ${PHOTO_AI_ENABLED:true}
      gemini-api-key: ${GEMINI_API_KEY:}
      gemini-model: ${GEMINI_IMAGE_MODEL:gemini-2.5-flash-image}
      poll-interval: 15s
  proofread:
    # mock (только механическая чистка пробелов/знаков) | gemini (орфография и пунктуация)
    provider: ${PROOFREAD_PROVIDER:mock}
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_TEXT_MODEL:gemini-2.5-flash}
  outbox:
    poll-interval: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

gem:
  security:
    # Общий служебный токен для /internal/** (совпадает у всех сервисов и в auth-service)
    internal-token: ${GEM_INTERNAL_TOKEN:local-dev-internal-token-change-me}
    jwt:
      jwk-set-uri: ${GEM_JWT_JWK_SET_URI:http://localhost:8081/oauth2/jwks}
      issuer: ${AUTH_JWT_ISSUER:http://localhost:8081}
      audience: ${AUTH_JWT_AUDIENCE:green-eco-mall}
