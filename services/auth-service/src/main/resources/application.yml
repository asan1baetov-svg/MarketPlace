server:
  # PORT задаёт хостинг (Railway/Heroku), SERVER_PORT — локальный запуск
  port: ${PORT:${SERVER_PORT:8081}}

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth}
    username: ${SPRING_DATASOURCE_USERNAME:gem}
    password: ${SPRING_DATASOURCE_PASSWORD:gem}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: auth-service
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "greenecomall.common.events.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true

auth:
  jwt:
    issuer: ${AUTH_JWT_ISSUER:http://localhost:8081}
    audience: ${AUTH_JWT_AUDIENCE:green-eco-mall}
    access-token-ttl: 15m
  refresh:
    ttl: 30d
  otp:
    ttl: 5m
    resend-interval: 60s
    length: 6
  mlm-sso:
    shared-secret: ${MLM_SSO_SHARED_SECRET:local-dev-mlm-shared-secret-change-me}
    issuer: ${MLM_SSO_ISSUER:mock-mlm}
    audience: ${MLM_SSO_AUDIENCE:green-eco-mall}
    clock-skew: 60s
    algorithm: ${MLM_SSO_ALGORITHM:HS256}
  outbox:
    poll-interval: 2s
  bootstrap-admin:
    # первый вход в админку: задать обе переменные при первом запуске, потом сменить пароль
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    super-admin: ${ADMIN_SUPER:true}
  internal:
    token: ${AUTH_INTERNAL_TOKEN:${GEM_INTERNAL_TOKEN:local-dev-internal-token-change-me}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
