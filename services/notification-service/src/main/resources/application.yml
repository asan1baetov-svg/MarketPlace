server:
  # PORT задаёт хостинг (Railway/Heroku), SERVER_PORT — локальный запуск
  port: ${PORT:${SERVER_PORT:8087}}

spring:
  application:
    name: notification-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/notification}
    username: ${SPRING_DATASOURCE_USERNAME:gem}
    password: ${SPRING_DATASOURCE_PASSWORD:gem}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

notification:
  default-locale: ru
  default-channels: PUSH
  outbox-poll-interval: 2s

gem:
  security:
    # Общий служебный токен для /internal/** (совпадает у всех сервисов и в auth-service)
    internal-token: ${GEM_INTERNAL_TOKEN:local-dev-internal-token-change-me}
    jwt:
      jwk-set-uri: ${GEM_JWT_JWK_SET_URI:http://localhost:8081/oauth2/jwks}
      issuer: ${AUTH_JWT_ISSUER:http://localhost:8081}
      audience: ${AUTH_JWT_AUDIENCE:green-eco-mall}
